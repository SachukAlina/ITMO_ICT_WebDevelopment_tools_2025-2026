name: Deploy MkDocs documentation

on:
  push:
    branches:
      - main
    paths:
      - "students/k3339/Sachuk_Alina/docs/**"
      - "students/k3339/Sachuk_Alina/mkdocs.yml"
      - "students/k3339/Sachuk_Alina/requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: students/k3339/Sachuk_Alina/requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r students/k3339/Sachuk_Alina/requirements-docs.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build documentation
        working-directory: students/k3339/Sachuk_Alina
        run: mkdocs build --strict --site-dir site

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: students/k3339/Sachuk_Alina/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
